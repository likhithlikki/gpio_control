# /etc/gpio-agent.conf  - the only thing you edit on the board
# Paste the Web app URL from Apps Script "Deploy" (ends in /exec), inside the quotes.
URL="https://script.google.com/macros/s/AKfycbwXd6wb8hsREkobud88okB95VDnytHa7HPUFHBPZAVRFGOEMyWKzDFUBm-umvxfuTrpgg/exec"
# Same value as SECRET in Code.gs (letters and digits only).
KEY="12345"
# Seconds to sleep between cycles (each cycle = 1 poll + 1 report request).
INTERVAL=2
# Set to 1 ONLY if HTTPS fails with certificate errors and you cannot install CA certificates.
# It disables certificate checking (someone on your network could then read your key).
INSECURE=0
