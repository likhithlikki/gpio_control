<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPIO Controller</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1c1e21;--muted:#6b7280;--line:#e5e7eb;
--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe;--on:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e26;--fg:#e8eaed;--muted:#9aa0a6;--line:#2a2f3a;
--ok:#6ee7a0;--okbg:#12361f;--warn:#fbbf24;--warnbg:#3a2a0c;--bad:#fca5a5;--badbg:#3b1414;--info:#93c5fd;--infobg:#14284d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 10px}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;margin-bottom:14px}
.pill.on{background:var(--okbg);color:var(--ok)}
.pill.off{background:var(--badbg);color:var(--bad)}
.pill.wait{background:var(--warnbg);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.name{font-weight:600;font-size:17px}
.meta{color:var(--muted);font-size:13px}
.vals{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:10px;font-size:14px}
.badge{margin-left:auto;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}
.b-confirmed{background:var(--okbg);color:var(--ok)}
.b-pending{background:var(--warnbg);color:var(--warn)}
.b-error{background:var(--badbg);color:var(--bad)}
.b-input{background:var(--infobg);color:var(--info)}
.detail{color:var(--muted);font-size:12px;width:100%}
.switch{position:relative;width:56px;height:32px;flex:none}
.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:#9ca3af;border-radius:32px;transition:.2s}
.switch span:before{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--on)}
.switch input:checked+span:before{transform:translateX(24px)}
#login{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
#login input{width:100%;padding:10px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin:8px 0}
#login button{padding:10px 18px;font-size:16px;border:0;border-radius:8px;background:var(--on);color:#fff}
#msg{color:var(--bad);font-size:14px;min-height:18px}
#foot{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
#toast{position:fixed;top:0;left:0;right:0;z-index:9;padding:12px 16px;text-align:center;font-weight:600;color:#fff;transform:translateY(-110%);transition:transform .3s;cursor:pointer}
#toast.show{transform:none}#toast.t-on{background:#15803d}#toast.t-off{background:#b91c1c}
#last{color:var(--muted);font-size:13px;margin:-6px 0 12px}
.switch.dis{opacity:.45}.switch input:disabled{cursor:not-allowed}
.stage{width:100%;font-size:13px;font-weight:600}.s-info{color:var(--info)}.s-ok{color:var(--ok)}.s-wait{color:var(--warn)}.s-bad{color:var(--bad)}
.lg{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.lg .t{color:var(--muted);width:100%;font-size:12px}
</style>
</head>
<body>
<div id="toast"></div>
<div class="wrap">
  <h1>GPIO Controller</h1>
  <div id="board" class="pill wait">Connecting…</div>
  <div id="last"></div>
  <div id="login" hidden>
    <div>Enter the access key</div>
    <input id="keyin" type="password" autocomplete="off" placeholder="Secret key">
    <button id="keybtn">Unlock</button>
    <div id="msg"></div>
  </div>
  <div id="pins"></div>
  <div class="card"><div class="name">Activity log (IST)</div><div id="logs" class="meta">Loading…</div></div>
  <div id="foot"></div>
</div>

<script>
/* ===== the ONLY thing to edit: your Apps Script Web app URL (ends in /exec) ===== */
var API = 'https://script.google.com/macros/s/AKfycbwXd6wb8hsREkobud88okB95VDnytHa7HPUFHBPZAVRFGOEMyWKzDFUBm-umvxfuTrpgg/exec';
/* ================================================================================ */

var KEY = '', built = '', busy = false, refs = {}, cmds = {}, prevOnline = null, online = false, toastT = 0, logN = 0;
try { KEY = localStorage.getItem('gpioKey') || ''; } catch (e) {}

function $(id) { return document.getElementById(id); }

// call the Apps Script web app: GET ?action=...&key=...
async function call(action, params) {
  var q = new URLSearchParams(Object.assign({ action: action, key: KEY }, params || {}));
  var r = await fetch(API + '?' + q.toString(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  var t = await r.text();
  try { return JSON.parse(t); }
  catch (e) { throw new Error('Bad reply from server (check the URL / deployment)'); }
}

function showLogin(msg) {
  $('login').hidden = false;
  $('pins').innerHTML = ''; built = ''; refs = {};
  $('msg').textContent = msg || '';
  $('board').className = 'pill wait';
  $('board').textContent = 'Locked';
}

$('keybtn').onclick = function () {
  KEY = $('keyin').value.trim();
  if (!KEY) return;
  try { localStorage.setItem('gpioKey', KEY); } catch (e) {}
  $('keyin').value = '';
  refresh();
};
$('keyin').onkeydown = function (e) { if (e.key === 'Enter') $('keybtn').onclick(); };

function ago(sec) {
  if (sec < 60) return sec + 's ago';
  if (sec < 3600) return Math.floor(sec / 60) + ' min ago';
  return Math.floor(sec / 3600) + ' h ago';
}

function fmt(p, v) {
  if (v === null || v === undefined) return '—';
  v = String(v);
  if (v === 'E') return 'ERROR';
  if (p.dir === 'in') return v === '1' ? 'HIGH' : 'LOW';
  return v === '1' ? 'ON' : 'OFF';
}

var LABEL = { confirmed: 'Confirmed', pending: 'Pending', error: 'Mismatch / Error', input: 'Input' };

function build(pins) {
  var host = $('pins');
  host.innerHTML = ''; refs = {};
  pins.forEach(function (p) {
    var card = document.createElement('div'); card.className = 'card';
    var row = document.createElement('div'); row.className = 'row';
    var left = document.createElement('div');
    var nm = document.createElement('div'); nm.className = 'name'; nm.textContent = p.name;
    var mt = document.createElement('div'); mt.className = 'meta';
    mt.textContent = 'GPIO ' + p.gpio + ' · ' + (p.dir === 'out' ? 'output' : 'input');
    left.appendChild(nm); left.appendChild(mt); row.appendChild(left);

    var cb = null;
    if (p.dir === 'out') {
      var lab = document.createElement('label'); lab.className = 'switch';
      cb = document.createElement('input'); cb.type = 'checkbox';
      var sp = document.createElement('span');
      lab.appendChild(cb); lab.appendChild(sp); row.appendChild(lab);
      cb.addEventListener('change', function () { toggle(p.id, cb); });
    }
    card.appendChild(row);

    var vals = document.createElement('div'); vals.className = 'vals';
    var des = document.createElement('span'), act = document.createElement('span');
    var badge = document.createElement('span'); badge.className = 'badge';
    var det = document.createElement('span'); det.className = 'detail';
    var stg = document.createElement('span'); stg.className = 'stage';
    if (p.dir === 'out') vals.appendChild(des);
    vals.appendChild(act); vals.appendChild(badge); vals.appendChild(det); vals.appendChild(stg);
    card.appendChild(vals);
    host.appendChild(card);
    refs[p.id] = { cb: cb, des: des, act: act, badge: badge, det: det, stg: stg, cmdT: 0 };
  });
}

function update(p) {
  var r = refs[p.id]; if (!r) return;
  var c = cmds[p.id];
  if (r.cb && !(c && c.stage === 'sending')) r.cb.checked = p.desired === 1;
  r.des.textContent = 'Desired: ' + fmt(p, p.desired);
  r.act.textContent = 'Actual: ' + fmt(p, p.actual);
  r.badge.className = 'badge b-' + p.state;
  r.badge.textContent = LABEL[p.state] || p.state;
  r.det.textContent = p.detail || '';
  if (c && (c.stage === 'sent' || c.stage === 'waiting') && p.cmd && p.cmd.t !== c.prevT && p.cmd.res !== 'pending') {
    c.stage = p.cmd.res === 'success' ? 'done' : 'failed';
    c.ms = p.cmd.ms; c.why = p.detail || 'no confirmation';
    loadLogs();
  }
  r.cmdT = p.cmd ? p.cmd.t : 0;
  showStage(p.id);
}

function showStage(id) {
  var r = refs[id], c = cmds[id]; if (!r || !r.stg) return;
  if (!c) { r.stg.textContent = ''; return; }
  var el = Math.round((Date.now() - c.t0) / 1000), t, k;
  if (c.stage === 'sending') { t = 'Sending…'; k = 'info'; }
  else if (c.stage === 'sent') { t = '✔ Sent successfully'; k = 'ok'; }
  else if (c.stage === 'waiting') { t = '⏳ Waiting for response… ' + el + ' s'; k = 'wait'; }
  else if (c.stage === 'done') { t = '✔ Done successfully · ' + (c.ms / 1000).toFixed(1) + ' s'; k = 'ok'; }
  else { t = '✖ Failed · ' + (c.why || 'error'); k = 'bad'; }
  r.stg.textContent = t; r.stg.className = 'stage s-' + k;
}

function running() {
  return Object.keys(cmds).some(function (id) { var s = cmds[id].stage; return s === 'sending' || s === 'sent' || s === 'waiting'; });
}
function lockAll() {
  var lock = running() || !online;
  Object.keys(refs).forEach(function (id) {
    var cb = refs[id].cb; if (!cb) return;
    cb.disabled = lock; cb.parentNode.className = 'switch' + (lock ? ' dis' : '');
  });
}

function toast(kind, text) {
  var t = $('toast'); t.className = 'show t-' + kind; t.textContent = text;
  clearTimeout(toastT);
  if (kind === 'on') toastT = setTimeout(function () { t.className = ''; }, 6000);
}
$('toast').onclick = function () { this.className = ''; };

function desc(x) {
  var v = String(x.value) === '1' ? 'ON' : 'OFF';
  if (x.event === 'command sent') return 'Sent: ' + x.pin + ' → ' + v;
  if (x.event === 'command done') return 'Done: ' + x.pin + ' → ' + v;
  if (x.event === 'command failed') return 'Failed: ' + x.pin + ' → ' + v + (x.source ? ' (' + x.source + ')' : '');
  if (x.event === 'actual') return 'Board reports ' + x.pin + ' = ' + (String(x.value) === 'E' ? 'ERROR' : v);
  var e = String(x.event); return e.charAt(0).toUpperCase() + e.slice(1) + (x.pin ? ' ' + x.pin : '');
}

async function loadLogs() {
  try {
    var r = await call('logs', { n: 50 });
    if (!r.ok) return;
    var host = $('logs'), closed = {}; host.textContent = '';
    r.rows.forEach(function (x) {
      if (x.event === 'command done' || x.event === 'command failed') closed[x.pin] = 1;
      else if (x.event === 'command sent' && closed[x.pin]) { delete closed[x.pin]; return; }
      var row = document.createElement('div'); row.className = 'lg';
      var t = document.createElement('div'); t.className = 't'; t.textContent = x.time;
      var d = document.createElement('span'); d.textContent = desc(x);
      var b = document.createElement('span');
      if (x.result) {
        b.className = 'badge ' + (x.result === 'Success' ? 'b-confirmed' : x.result === 'Failed' ? 'b-error' : 'b-pending');
        b.textContent = x.result + (x.secs !== '' ? ' · ' + x.secs + ' s' : '');
      }
      row.appendChild(t); row.appendChild(d); row.appendChild(b); host.appendChild(row);
    });
    if (!r.rows.length) host.textContent = 'No entries yet';
  } catch (e) {}
}

function render(s) {
  var b = $('board');
  online = s.online;
  if ((prevOnline === null && !s.online) || (prevOnline !== null && s.online !== prevOnline)) {
    toast(s.online ? 'on' : 'off', s.online ? '✔ Board is ONLINE' : '✖ Board is OFFLINE');
  }
  prevOnline = s.online;
  document.title = (s.online ? '● ' : '○ ') + 'GPIO Controller';
  $('last').textContent = 'Last active: ' + (s.seenAt ? s.seenAt + ' IST' : 'never');
  if (s.online) { b.className = 'pill on'; b.textContent = 'Board online · seen ' + s.seenAgo + 's ago'; }
  else {
    b.className = 'pill off';
    b.textContent = s.seenAgo === null ? 'Board offline · never seen' : 'Board offline · last seen ' + ago(s.seenAgo);
  }
  var sig = s.pins.map(function (p) { return [p.id, p.name, p.gpio, p.dir].join(':'); }).join(',');
  if (sig !== built) { build(s.pins); built = sig; }
  s.pins.forEach(update);
  lockAll();
}

function fail(id, why) {
  cmds[id].stage = 'failed'; cmds[id].why = why; showStage(id); lockAll();
}

async function toggle(id, cb) {
  if (running() || !online) { cb.checked = !cb.checked; return; }
  cmds[id] = { stage: 'sending', t0: Date.now(), prevT: refs[id].cmdT || 0 };
  lockAll(); showStage(id);
  try {
    var res = await call('setPin', { pin: id, value: cb.checked ? 1 : 0 });
    if (!res.ok) {
      if (res.error === 'badkey') { KEY = ''; showLogin('Wrong key'); return; }
      fail(id, res.error); return;
    }
    cmds[id].stage = 'sent'; showStage(id);
    setTimeout(function () { if (cmds[id] && cmds[id].stage === 'sent') { cmds[id].stage = 'waiting'; showStage(id); } }, 800);
  } catch (e) { fail(id, 'could not send'); }
  refresh();
}

async function refresh() {
  if (!KEY) { showLogin(''); return; }
  if (busy) return;
  busy = true;
  try {
    var s = await call('status');
    if (!s.ok) {
      KEY = '';
      try { localStorage.removeItem('gpioKey'); } catch (e) {}
      showLogin(s.error === 'badkey' ? 'Wrong key' : 'Error: ' + s.error);
    } else {
      $('login').hidden = true;
      render(s);
      if (logN++ % 4 === 0) loadLogs();
      $('foot').textContent = 'Updated ' + s.now + ' IST · refreshes every 2 s';
    }
  } catch (e) {
    $('foot').textContent = 'Connection problem: ' + (e && e.message ? e.message : e);
  } finally { busy = false; }
}

setInterval(function () {
  Object.keys(cmds).forEach(function (id) {
    var c = cmds[id];
    if (c.stage === 'sending' || c.stage === 'sent' || c.stage === 'waiting') {
      if (Date.now() - c.t0 > 25000) { c.stage = 'failed'; c.why = 'no answer'; lockAll(); }
      showStage(id);
    }
  });
}, 500);
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
